[project]
name = "langchain-md-chunker"
version = "0.1.0"
description = "Split markdown/MDX into chunks that keep exact source character offsets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["markdown", "mdx", "chunking", "rag", "retrieval", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/Ashitaka-Laputa-IV/langchain-md-chunker"
Repository = "https://github.com/Ashitaka-Laputa-IV/langchain-md-chunker"
Issues = "https://github.com/Ashitaka-Laputa-IV/langchain-md-chunker/issues"
Documentation = "https://github.com/Ashitaka-Laputa-IV/langchain-md-chunker/blob/main/docs/api/index.md"
Changelog = "https://github.com/Ashitaka-Laputa-IV/langchain-md-chunker/blob/main/CHANGELOG.md"

[project.scripts]
chunk = "langchain_md_chunker.cli:main"
langchain-md-chunker = "langchain_md_chunker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
